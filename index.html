<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thời Khóa Biểu</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: linear-gradient(135deg,#2563eb,#7c3aed,#ec4899);
  background-size: 300% 300%;
  animation: bgMove 12s ease infinite;
}
@keyframes bgMove {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
.glass {
  background: rgba(255,255,255,.95);
  backdrop-filter: blur(16px);
}
.cell:hover {
  background: #eef2ff;
}
.btn{
  color:white;
  padding:10px 18px;
  border-radius:12px;
  font-weight:bold;
  transition:.3s;
}
.btn:hover{transform:scale(1.07)}
</style>
</head>

<body class="min-h-screen p-6">

<!-- HEADER -->
<div class="glass rounded-3xl p-8 max-w-7xl mx-auto shadow-xl mb-8 text-center">
  <div class="flex justify-center items-center gap-4">
    <div class="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-4 rounded-2xl shadow-lg">
      📅
    </div>
    <h1 class="text-4xl font-black bg-gradient-to-r from-blue-600 to-pink-500 bg-clip-text text-transparent">
      Thời Khóa Biểu
    </h1>
  </div>
  <p class="text-gray-600 mt-2">Quản lý lịch học thông minh</p>

  <div class="flex justify-center gap-4 mt-4">
    <span class="px-4 py-2 bg-blue-600 text-white rounded-full">📘 11 môn</span>
    <span class="px-4 py-2 bg-purple-600 text-white rounded-full">⏰ 0 tiết</span>
  </div>
</div>

<!-- MAIN -->
<div class="glass rounded-3xl p-6 max-w-7xl mx-auto shadow-xl">

<!-- BUTTONS -->
<div class="flex flex-wrap gap-3 mb-6">
  <button onclick="autoGen(1)" class="btn bg-blue-600">✨ 1 tuần</button>
  <button onclick="autoGen(2)" class="btn bg-pink-600">✨ 2 tuần</button>
  <button onclick="autoGen(3)" class="btn bg-orange-600">✨ 3 tuần</button>
  <button onclick="resetTKB()" class="btn bg-gray-600">Reset</button>
  <button onclick="exportData()" class="btn bg-green-600">⬇ Xuất</button>
  <input type="file" onchange="importData(event)" class="hidden" id="import">
  <button onclick="document.getElementById('import').click()" class="btn bg-teal-600">⬆ Nhập</button>
</div>

<!-- TABLE -->
<div class="overflow-x-auto">
<table class="w-full text-center border-collapse">
<thead>
<tr class="text-white">
  <th class="p-3 bg-gradient-to-r from-blue-600 to-purple-600">Tiết</th>
  <th class="p-3 bg-gradient-to-r from-blue-600 to-purple-600">Thứ 2</th>
  <th class="p-3 bg-gradient-to-r from-blue-600 to-purple-600">Thứ 3</th>
  <th class="p-3 bg-gradient-to-r from-blue-600 to-purple-600">Thứ 4</th>
  <th class="p-3 bg-gradient-to-r from-blue-600 to-purple-600">Thứ 5</th>
  <th class="p-3 bg-gradient-to-r from-blue-600 to-purple-600">Thứ 6</th>
  <th class="p-3 bg-gradient-to-r from-blue-600 to-purple-600">Thứ 7</th>
</tr>
</thead>
<tbody id="tkb"></tbody>
</table>
</div>

</div>

<script>
const days=["T2","T3","T4","T5","T6","T7"];
const times=[
"7:00-7:45","7:50-8:35","8:40-9:25","9:35-10:20",
"10:25-11:10","13:30-14:15","14:20-15:05","15:10-15:55","16:00-16:45"
];
const subjects=["Toán","Văn","Anh","Lý","Hóa","Sinh","Sử","Địa","GDCD","Tin","TD"];
const colors=["#2563eb","#ec4899","#8b5cf6","#10b981","#f59e0b","#14b8a6","#ef4444"];

function render(){
  const tb=document.getElementById("tkb");
  tb.innerHTML="";
  times.forEach((t,i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td class="p-3 font-bold bg-gray-100">
        Tiết ${i+1}<br>
        <span class="text-xs">${t}</span>
      </td>
    `;
    days.forEach(d=>{
      const key=d+"-"+i;
      const data=localStorage.getItem(key);
      const td=document.createElement("td");
      td.className="cell p-4 border cursor-pointer transition";

      if(data){
        const obj=JSON.parse(data);
        td.innerHTML=`
          <div class="text-white font-bold rounded-lg p-2" style="background:${obj.color}">
            ${obj.name}
          </div>
        `;
      }else{
        td.innerHTML="+";
      }

      td.onclick=()=>{
        const name=prompt("Nhập môn:");
        if(!name) return;
        localStorage.setItem(key,JSON.stringify({
          name,
          color:colors[Math.floor(Math.random()*colors.length)]
        }));
        render();
      };
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
}

function autoGen(w){
  localStorage.clear();
  let idx=0;
  for(let i=0;i<w*times.length;i++){
    days.forEach(d=>{
      localStorage.setItem(d+"-"+(i%times.length),JSON.stringify({
        name:subjects[idx%subjects.length],
        color:colors[idx%colors.length]
      }));
      idx++;
    });
  }
  render();
}

function resetTKB(){
  localStorage.clear();
  render();
}

function exportData(){
  const data=JSON.stringify(localStorage);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([data]));
  a.download="tkb.json";
  a.click();
}

function importData(e){
  const r=new FileReader();
  r.onload=()=>{
    const d=JSON.parse(r.result);
    Object.keys(d).forEach(k=>localStorage.setItem(k,d[k]));
    render();
  }
  r.readAsText(e.target.files[0]);
}

render();
</script>

</body>
</html>
